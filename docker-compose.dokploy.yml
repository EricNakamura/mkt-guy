name: mkt-guy

x-app-env: &app-env
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
  OPENROUTER_ASR_MODEL: ${OPENROUTER_ASR_MODEL:-openai/whisper-large-v3}
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
  SITE_URL: ${SITE_URL:-https://memremodelacoes.pt}
  WHATSAPP: ${WHATSAPP:-351933873125}
  PUBLIC_URL: ${PUBLIC_URL:-https://mkt.memremodelacoes.pt}
  DASHBOARD_AUTH: ${DASHBOARD_AUTH:-}
  PUBLISH_DIR: /published

# Deploy Dokploy/Traefik: sem portas publicadas; o proxy fala com a rede interna.
# Se o Dokploy não resolver o contexto do build, define BUILD_CONTEXT com o caminho do clone.
services:
  web:
    build:
      context: ${BUILD_CONTEXT:-.}
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      PREVIEW_PORT: 4321
    expose:
      - "4321"
    volumes:
      - obras:/app/data
      - obras-public:/published
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4321/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bot:
    build:
      context: ${BUILD_CONTEXT:-.}
      dockerfile: Dockerfile
    command: ["node", "src/telegram.js"]
    restart: unless-stopped
    environment:
      <<: *app-env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ALLOWED_CHAT_IDS: ${ALLOWED_CHAT_IDS:-}
    volumes:
      - obras:/app/data
      - obras-public:/published
    depends_on:
      web:
        condition: service_healthy

volumes:
  obras:
  # O volume é criado pelo compose do site (mm-remodelacoes) e consumido aqui.
  obras-public:
    external: true
    name: mm-obras-public
